<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5 13a11 11 0 0 1 22 0' fill='none' stroke='%231F5135' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M27 19a11 11 0 0 1-22 0' fill='none' stroke='%232563C9' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">

<body>
  <header class="top">
    <a class="brand" href="./" aria-label="Gochi Cycle home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 13a11 11 0 0 1 22 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path d="M27 19a11 11 0 0 1-22 0" fill="none" stroke="#A9D3B8" stroke-width="4" stroke-linecap="round"/></svg>

      <button data-role="store" data-i18n="roleStore"></button>

      <p class="panecap" data-i18n="capStore"></p>
      <div class="device"><div id="storeApp" class="mount"></div></div>
    </section>
    <section class="pane wide" id="paneAdmin">
      <div class="device dash"><div id="adminApp" class="mount"></div></div>
    </section>
    <aside class="story">
